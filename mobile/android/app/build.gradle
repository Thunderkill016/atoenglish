plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atoenglish.shell'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atoenglish.shell'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    // Pinned debug key so every CI/local build shares one signature —
    // Android refuses install-over when the key changes between builds.
    // PKCS12 store (JDK default); standard debug credentials, not a secret.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

dependencies {
    // On-device EN→VI translation — free, runs offline after model download.
    implementation 'com.google.mlkit:translate:17.0.3'
}
