name: Verify Database

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/**"
      - "src/types/supabase.ts"
      - "scripts/**db**"
      - ".github/workflows/verify-db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/types/supabase.ts"
      - "scripts/**db**"
      - ".github/workflows/verify-db.yml"
  workflow_dispatch:

concurrency:
  group: verify-db-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Fresh migrations, database lint, and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Start fresh local Postgres and apply all migrations
        run: supabase db start

      - name: Lint database functions and schema
        run: supabase db lint --local --level error --fail-on error

      - name: Run pgTAP database and RLS tests
        run: supabase test db --local
