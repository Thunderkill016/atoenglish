name: mobile-apk

on:
  workflow_dispatch:
  push:
    branches: [docs/005-ejoy-trancy-system]
    paths:
      - mobile/**
      - .github/workflows/mobile-apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a preinstalled Android SDK ($ANDROID_HOME +
      # cmdline-tools); android-actions/setup-android is broken on it
      # (legacy 'tools' package was removed upstream).
      - name: Install SDK platform + build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p mobile/android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: atoenglish-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
