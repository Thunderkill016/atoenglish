name: Reality Benchmark Harness

on:
  pull_request:
    branches: ["frontier/nep-core-foundation-v1"]
    paths:
      - "benchmarks/reality-slam-v1/**"
      - "specs/004-core-reality-benchmark-v1/**"
      - ".github/workflows/reality-benchmark.yml"
  push:
    branches:
      - "gemini/core-reality-benchmark-v1"
    paths:
      - "benchmarks/reality-slam-v1/**"
      - "specs/004-core-reality-benchmark-v1/**"
      - ".github/workflows/reality-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reality-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Python benchmark contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/reality-slam-v1/requirements.lock

      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check -r benchmarks/reality-slam-v1/requirements.lock

      - name: Compile benchmark scripts
        run: python -m compileall -q benchmarks/reality-slam-v1/scripts benchmarks/reality-slam-v1/tests

      - name: Run benchmark contract tests
        run: python -m unittest discover -v -s benchmarks/reality-slam-v1/tests -p 'test_*.py'

      - name: Prove raw benchmark cache is absent from Git checkout
        run: test ! -e .cache/benchmarks/slam-2018
