name: Verify

on:
  pull_request:
    branches: [main, "frontier/nep-core-foundation-v1"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "frontier/nep-core-foundation-v1"
      - "gemini/**"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Verify documentation governance
        run: npm run check:source-of-truth

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Content standards
        run: npm run test:content-standard
